<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El estándar del género</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;position:relative;background:#BFE3FF;color:#5B3A29;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif}
.floor{position:absolute;left:0;right:0;top:470px;bottom:0;background:#FFF8EC}
.win{position:absolute;left:44px;top:120px;width:120px;height:130px;border-radius:60px 60px 12px 12px;background:#E8F6FF;border:8px solid #FFF8EC}
.rug{position:absolute;left:55px;top:468px;width:280px;height:70px;border-radius:50%;background:#FF8FB1}
.top{position:absolute;inset:16px 16px auto;display:flex;justify-content:space-between;align-items:center}
.coin{background:#FFF8EC;border-radius:999px;padding:8px 18px;font-size:24px;font-weight:800;box-shadow:0 4px 0 rgba(91,58,41,.2)}
.shop{background:#FF8FB1;color:#5B3A29;border-radius:999px;padding:10px 22px;font-size:24px;font-weight:800;box-shadow:0 5px 0 #E06A8E}
.pet{position:absolute;left:105px;top:290px;width:180px;height:190px;border-radius:48% 52% 46% 54%/56% 54% 46% 44%;background:#7ED6A5;border:6px solid #5B3A29}
.pet i{position:absolute;top:74px;width:22px;height:30px;border-radius:50%;background:#5B3A29}
.pet b{position:absolute;top:-34px;left:66px;width:40px;height:48px;border-radius:50% 50% 0 0;background:#7ED6A5;border:6px solid #5B3A29;border-bottom:0}
.bars{position:absolute;left:18px;right:18px;top:578px;background:#fff;border-radius:24px;padding:14px 16px;display:grid;gap:10px;box-shadow:0 6px 0 rgba(91,58,41,.15)}
.b{display:flex;align-items:center;gap:10px}
.b em{width:26px;height:26px;border-radius:50%}
.b div{flex:1;height:14px;border-radius:999px;background:#F0E6D6}
.b u{display:block;height:14px;border-radius:999px}
.btns{position:absolute;left:16px;right:16px;bottom:18px;display:flex;justify-content:space-between}
.btns div{width:62px;height:62px;border-radius:50%;box-shadow:0 5px 0 rgba(91,58,41,.25)}
</style></head><body>
<div class="win"></div><div class="floor"></div><div class="rug"></div>
<div class="top"><div class="coin">1.240</div><div class="shop">Tienda</div></div>
<div class="pet"><b></b><i style="left:52px"></i><i style="left:104px"></i></div>
<div class="bars">
 <div class="b"><em style="background:#FFB45C"></em><div><u style="width:66%;background:#FFB45C"></u></div></div>
 <div class="b"><em style="background:#9DB7FF"></em><div><u style="width:42%;background:#9DB7FF"></u></div></div>
 <div class="b"><em style="background:#7ED6A5"></em><div><u style="width:83%;background:#7ED6A5"></u></div></div>
 <div class="b"><em style="background:#FF8FB1"></em><div><u style="width:25%;background:#FF8FB1"></u></div></div>
 <div class="b"><em style="background:#FF7A7A"></em><div><u style="width:92%;background:#FF7A7A"></u></div></div>
</div>
<div class="btns"><div style="background:#FFB45C"></div><div style="background:#9DB7FF"></div><div style="background:#7ED6A5"></div><div style="background:#FF8FB1"></div><div style="background:#FF7A7A"></div></div>
</body></html>
