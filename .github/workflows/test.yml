name: Pruebas

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Servidor y reglas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    name: App de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Los vectores de referencia salen de las reglas y los modelos en JS:
      # si alguien cambia shared/ o la escena sin regenerarlos, Kotlin
      # compararía contra datos viejos.
      - name: Vectores de referencia al día
        working-directory: android
        run: |
          node tools/golden.mjs
          node tools/sculpt-golden.mjs
          git diff --exit-code -- app/src/test/resources/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
